services:

  adminer:
    image: adminer:latest
    container_name: foodcore-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - fastfood-network
    restart: unless-stopped
    env_file:
      - .env

  azure-service-bus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: foodcore-azure-service-bus-emulator
    restart: unless-stopped
    volumes:
      - "./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    depends_on:
      - azure-service-bus-emulator-sql-server
    ports:
      - "${AZ_SVC_BUS_PORT}:5672"
      - "${AZ_SVC_BUS_MGMT_PORT}:5300"
    networks:
      - fastfood-network
    env_file:
      - .env
      
  azure-service-bus-emulator-sql-server:
    container_name: "foodcore-azure-service-bus-emulator-sql-server"
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    networks:
      fastfood-network:
        aliases:
          - "${SQL_SERVER}"
    env_file:
      - .env
    volumes:
      - az_svc_bus_sql_data:/var/opt/mssql

  
  azure-blob-storage-emulator:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: foodcore-azure-blob-emulator
    restart: unless-stopped
    command: azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --debug /data/debug.log
    ports:
      - "${AZURE_BLOB_BLOB_PORT}:10000"
      - "${AZURE_BLOB_QUEUE_PORT}:10001"
      - "${AZURE_BLOB_TABLE_PORT}:10002"
    volumes:
      - azurite_data:/data
    networks:
      - fastfood-network
    env_file:
      - .env

  zipkin:
    image: openzipkin/zipkin
    container_name: foodcore-zipkin
    ports:
      - "${ZIPKIN_PORT}:${ZIPKIN_PORT}"
    networks:
      - fastfood-network
    restart: unless-stopped
    env_file:
      - .env

  smtp-server:
    image: maildev/maildev:latest
    container_name: foodcore-smtp-server
    restart: unless-stopped
    ports:
      - "${SMTP_PORT}:1025"
      - "${SMTP_UI_PORT}:1080"
    networks:
      - fastfood-network
    env_file:
      - .env

  localstack:
    image: localstack/localstack-pro:latest
    container_name: foodcore-localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_EDGE_PORT}:4566"
      - "4510-4559:4510-4559"
    networks:
      - fastfood-network
    volumes:
      - "localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      - .env

networks:
  fastfood-network:
    driver: bridge

volumes:
  az_svc_bus_sql_data:
  localstack_data:
  azurite_data: